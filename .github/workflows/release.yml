# Sürüm yayımlar: macOS (Apple Silicon) ve Windows paketlerini derler, `v{sürüm}` etiketli
# GitHub Release'e yükler ve otomatik güncelleyicinin okuduğu imzalı `latest.json`'u ekler.
#
# Tetikleme: `main` üzerinde elle — `gh workflow run release.yml` (ya da Actions → release →
# Run workflow). Etiketi tauri-action kendisi oluşturur. Etiketle tetiklenmiyor, çünkü GitHub
# önbelleği oluşturulduğu ref'e bağlar: etiketteki önbelleği sonraki etiket göremez ve her
# sürüm baştan derlenir. main'deki önbelleği ise sonraki her çalıştırma kullanır.
#
# Gerekli repo gizlileri (Settings → Secrets and variables → Actions):
#   TAURI_SIGNING_PRIVATE_KEY           ~/.tauri/hilus-updater.key dosyasının içeriği
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  ~/.tauri/hilus-updater.password dosyasının içeriği
name: release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: Hilus v__VERSION__
          releaseBody: "Kurulum: Windows için .exe (veya .msi), macOS (Apple Silicon) için .dmg. Kurulu uygulama bu sürümü kendisi bulur ve güncellenir."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
